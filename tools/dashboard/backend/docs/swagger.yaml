definitions:
  handler.AlertRuleGroupSummary:
    properties:
      interval:
        description: rule evaluation interval
        type: string
      name:
        type: string
      rules:
        description: frontend uses rules instead of rulesCount
        type: integer
      severities:
        description: list of severity levels within the group
        items:
          type: string
        type: array
    type: object
  handler.AlertRuleTemplateDetail:
    properties:
      category:
        type: string
      content:
        type: string
      description:
        type: string
      displayName:
        type: string
      name:
        type: string
    type: object
  handler.AlertRuleTemplateSummary:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      categories:
        items:
          type: string
        type: array
      category:
        type: string
      description:
        type: string
      displayName:
        type: string
      file:
        description: source filename
        type: string
      groups:
        items:
          $ref: '#/definitions/handler.AlertRuleGroupSummary'
        type: array
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      primarySeverity:
        type: string
      size:
        description: file size
        type: integer
      source:
        description: chart or embedded
        type: string
      title:
        description: used by frontend
        type: string
      updatedAt:
        description: update time
        type: string
    type: object
  handler.FacetBucket:
    properties:
      count:
        type: integer
      key:
        type: string
    type: object
  handler.FacetSpec:
    properties:
      field:
        type: string
      name:
        type: string
      order:
        description: count|key
        type: string
      size:
        type: integer
    type: object
  handler.HistogramBucket:
    properties:
      count:
        type: integer
      key:
        type: string
    type: object
  handler.HistogramSpec:
    properties:
      field:
        type: string
      interval:
        description: 1m,5m,1h
        type: string
      minDocCount:
        type: integer
      name:
        type: string
    type: object
  handler.LogPreset:
    properties:
      facets:
        items:
          type: string
        type: array
      histogram:
        properties:
          field:
            type: string
          intervals:
            description: 'recommendation list: e.g. ["1m","5m","1h","1d"]'
            items:
              type: string
            type: array
        type: object
      indexPattern:
        type: string
    type: object
  handler.NormalizedResponse:
    properties:
      facets:
        additionalProperties:
          items:
            $ref: '#/definitions/handler.FacetBucket'
          type: array
        type: object
      histogram:
        items:
          $ref: '#/definitions/handler.HistogramBucket'
        type: array
      items:
        items:
          additionalProperties: {}
          type: object
        type: array
      total:
        type: integer
    type: object
  handler.PrecheckRequest:
    properties:
      operation:
        description: scale|upgrade|config
        type: string
      targetSpec:
        additionalProperties: {}
        description: optional, reserved
        type: object
    type: object
  handler.PrometheusRule:
    properties:
      alertsCount:
        type: integer
      groups:
        items: {}
        type: array
      groupsCount:
        type: integer
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      namespace:
        type: string
      recordingCount:
        type: integer
      rulesCount:
        type: integer
    type: object
  handler.QueryRequest:
    properties:
      aggs:
        additionalProperties: {}
        type: object
      facets:
        items:
          $ref: '#/definitions/handler.FacetSpec'
        type: array
      from:
        type: integer
      histogram:
        $ref: '#/definitions/handler.HistogramSpec'
      host:
        type: string
      index:
        type: string
      normalize:
        type: boolean
      query:
        additionalProperties: {}
        type: object
      size:
        type: integer
      sort:
        items:
          additionalProperties: {}
          type: object
        type: array
      timeRange:
        additionalProperties:
          type: string
        description: '{"field":"@timestamp","from":"2024-01-01T00:00:00Z","to":"2024-01-02T00:00:00Z"}'
        type: object
    type: object
  handler.Strategy:
    properties:
      clusterName:
        type: string
      clusterNamespace:
        type: string
      enableCN:
        type: boolean
      enableDN:
        type: boolean
      name:
        type: string
      output:
        properties:
          authType:
            description: none|basic
            type: string
          caCrt:
            description: ditto
            type: string
          hosts:
            type: string
          password:
            description: only for precheck; should be provided once and persisted
              to Secret by apply
            type: string
          type:
            description: elasticsearch|stdout
            type: string
          useTLS:
            type: boolean
          username:
            type: string
        type: object
    type: object
  handler.TestImageRegistryRequest:
    properties:
      registry:
        type: string
    required:
    - registry
    type: object
  handler.UpdateImageRegistryRequest:
    properties:
      customRegistry:
        type: string
      defaultRegistry:
        type: string
      mirrors:
        items:
          type: string
        type: array
      registry:
        type: string
    type: object
  polardbxclusters.UpgradeCandidate:
    properties:
      notes:
        type: string
      recommended:
        type: boolean
      version:
        type: string
    type: object
  polardbxclusters.UpgradePlanResponse:
    properties:
      candidates:
        items:
          $ref: '#/definitions/polardbxclusters.UpgradeCandidate'
        type: array
      currentVersion:
        type: string
      matrix:
        additionalProperties: {}
        type: object
    type: object
  service.DiagnosticJob:
    properties:
      cluster:
        type: string
      completedAt:
        type: string
      id:
        type: string
      message:
        type: string
      namespace:
        type: string
      outputPath:
        type: string
      progress:
        type: integer
      startedAt:
        type: string
      status:
        type: string
    type: object
  xstores.BackupRemoteInfoDTO:
    description: Remote storage information for a backup.
    properties:
      path:
        description: Remote path or URL
        example: s3://my-bucket/backups/my-xstore/20240115
        type: string
      sink:
        description: Sink name
        example: my-s3-sink
        type: string
      size:
        description: Backup size
        example: 1.5Gi
        type: string
      storageType:
        description: Storage type
        example: s3
        type: string
    type: object
  xstores.BackupStorageProviderDTO:
    description: Configuration for backup storage destination.
    properties:
      sink:
        description: Sink name reference
        example: my-s3-sink
        type: string
      storageName:
        description: Storage type (S3, OSS, NFS, etc.)
        example: s3
        type: string
    type: object
  xstores.ConditionDTO:
    description: Resource condition indicating current state.
    properties:
      lastTransitionTime:
        description: Last time the condition transitioned
        type: string
      message:
        description: Human-readable message
        example: All pods are ready
        type: string
      reason:
        description: Reason for the condition's last transition
        example: PodReady
        type: string
      status:
        description: Status of the condition (True, False, Unknown)
        example: "True"
        type: string
      type:
        description: Type of the condition
        example: Ready
        type: string
    type: object
  xstores.ContainerStatusDTO:
    description: Status of a container within a pod.
    properties:
      image:
        description: Container image
        example: polardbx/polardbx-engine:latest
        type: string
      name:
        description: Container name
        example: engine
        type: string
      ready:
        description: Whether container is ready
        example: true
        type: boolean
      restartCount:
        description: Restart count
        example: 0
        type: integer
    type: object
  xstores.MessageResponseDTO:
    description: Simple response with a message field.
    properties:
      message:
        description: Response message
        example: Operation completed successfully
        type: string
    type: object
  xstores.ObjectMetaDTO:
    description: Kubernetes resource metadata including name, namespace, labels and
      annotations.
    properties:
      annotations:
        additionalProperties:
          type: string
        description: Annotations attached to the resource
        type: object
      creationTimestamp:
        description: Creation timestamp
        type: string
      generation:
        description: Generation number, incremented on spec changes
        example: 1
        type: integer
      labels:
        additionalProperties:
          type: string
        description: Labels attached to the resource
        type: object
      name:
        description: Resource name, unique within namespace
        example: my-xstore
        type: string
      namespace:
        description: Kubernetes namespace
        example: default
        type: string
      resourceVersion:
        description: Resource version for optimistic concurrency
        example: "12345"
        type: string
      uid:
        description: Unique identifier for the resource
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
    type: object
  xstores.RebuildProgressDTO:
    description: Detailed progress of an XStore rebuild operation.
    properties:
      currentStep:
        description: Current step name
        example: CopyingData
        type: string
      eta:
        description: Estimated time remaining
        example: 10m
        type: string
      message:
        description: Status message
        example: Copying data from leader
        type: string
      percentage:
        description: Progress percentage (0-100)
        example: 60
        type: integer
      stepNumber:
        description: Step number
        example: 3
        type: integer
      targetPod:
        description: Target pod being rebuilt
        example: my-xstore-1
        type: string
      totalSteps:
        description: Total steps
        example: 5
        type: integer
    type: object
  xstores.RebuildStatusDTO:
    description: Status of an XStore rebuild operation.
    properties:
      endTime:
        description: End time of rebuild
        type: string
      error:
        description: Error message if failed
        type: string
      phase:
        description: Current rebuild phase
        example: Completed
        type: string
      progress:
        description: Progress percentage (0-100)
        example: 100
        type: integer
      rebuilding:
        description: Whether rebuild is in progress
        example: false
        type: boolean
      startTime:
        description: Start time of rebuild
        type: string
      targetPod:
        description: Pod being rebuilt
        example: my-xstore-1
        type: string
    type: object
  xstores.ResourceListDTO:
    description: Resource quantities for CPU and memory.
    properties:
      cpu:
        description: CPU resource (e.g., "2", "500m")
        example: "2"
        type: string
      memory:
        description: Memory resource (e.g., "4Gi", "512Mi")
        example: 4Gi
        type: string
    type: object
  xstores.ResourceRequirementsDTO:
    description: CPU and memory resource requirements.
    properties:
      limits:
        allOf:
        - $ref: '#/definitions/xstores.ResourceListDTO'
        description: Resource limits
      requests:
        allOf:
        - $ref: '#/definitions/xstores.ResourceListDTO'
        description: Resource requests
    type: object
  xstores.XSTORETDEDTO:
    description: TDE (Transparent Data Encryption) configuration.
    properties:
      enable:
        description: Enable TDE
        example: false
        type: boolean
    type: object
  xstores.XStoreBackupBinlogDTO:
    description: XStoreBackupBinlog represents continuous binlog backup for an XStore.
    properties:
      apiVersion:
        description: API version
        example: polardbx.aliyun.com/v1
        type: string
      kind:
        description: Resource kind
        example: XStoreBackupBinlog
        type: string
      metadata:
        allOf:
        - $ref: '#/definitions/xstores.ObjectMetaDTO'
        description: Resource metadata
      spec:
        allOf:
        - $ref: '#/definitions/xstores.XStoreBackupBinlogSpecDTO'
        description: Desired state specification
      status:
        allOf:
        - $ref: '#/definitions/xstores.XStoreBackupBinlogStatusDTO'
        description: Observed state status
    type: object
  xstores.XStoreBackupBinlogSpecDTO:
    description: Desired state specification for XStore binlog backup.
    properties:
      localExpireLogSeconds:
        description: Local expire time for binlogs
        example: 604800
        type: integer
      maxLocalBinlogCount:
        description: Maximum local binlog usage
        example: 10
        type: integer
      storageProvider:
        allOf:
        - $ref: '#/definitions/xstores.BackupStorageProviderDTO'
        description: Storage provider configuration
      xstore:
        allOf:
        - $ref: '#/definitions/xstores.XStoreReferenceDTO'
        description: Reference to the source XStore
    type: object
  xstores.XStoreBackupBinlogStatusDTO:
    description: Current observed state of XStore binlog backup.
    properties:
      checkpointTime:
        description: Checkpoint timestamp
        type: string
      lastUploadedFile:
        description: Last uploaded binlog file
        example: mysql-bin.000015
        type: string
      phase:
        description: Current phase
        example: Running
        type: string
    type: object
  xstores.XStoreBackupDTO:
    description: XStoreBackup represents a point-in-time backup of an XStore instance.
    properties:
      apiVersion:
        description: API version
        example: polardbx.aliyun.com/v1
        type: string
      kind:
        description: Resource kind
        example: XStoreBackup
        type: string
      metadata:
        allOf:
        - $ref: '#/definitions/xstores.ObjectMetaDTO'
        description: Resource metadata
      spec:
        allOf:
        - $ref: '#/definitions/xstores.XStoreBackupSpecDTO'
        description: Desired state specification
      status:
        allOf:
        - $ref: '#/definitions/xstores.XStoreBackupStatusDTO'
        description: Observed state status
    type: object
  xstores.XStoreBackupSpecDTO:
    description: Desired state specification for an XStore backup.
    properties:
      cleanPolicy:
        description: Cleanup policy when backup is deleted (Retain, Delete, OnFailure)
        example: Retain
        type: string
      engine:
        description: Storage engine type
        example: galaxy
        type: string
      preferredBackupRole:
        description: Preferred node role for backup (leader, follower)
        example: follower
        type: string
      retentionTime:
        description: How long to retain this backup
        example: 168h
        type: string
      storageProvider:
        allOf:
        - $ref: '#/definitions/xstores.BackupStorageProviderDTO'
        description: Storage provider configuration
      timezone:
        description: Timezone for backup timestamps
        example: Asia/Shanghai
        type: string
      xstore:
        allOf:
        - $ref: '#/definitions/xstores.XStoreReferenceDTO'
        description: Reference to the source XStore
    type: object
  xstores.XStoreBackupStatusDTO:
    description: Current observed state of the XStore backup.
    properties:
      backupSetPath:
        description: Backup set path/name
        example: /backups/my-xstore/20240115
        type: string
      backupSize:
        description: Total backup size
        example: 1.5Gi
        type: string
      commitIndex:
        description: Commit index at backup time
        example: 12345
        type: integer
      endTime:
        description: Backup end time
        type: string
      phase:
        description: Current backup phase (New, Running, Completed, Failed, Deleting)
        example: Completed
        type: string
      startTime:
        description: Backup start time
        type: string
      storageName:
        description: Storage type used
        example: s3
        type: string
      targetPod:
        description: Pod where backup was executed
        example: my-xstore-1
        type: string
    type: object
  xstores.XStoreConfigDTO:
    description: MySQL configuration overlay for XStore.
    properties:
      dynamic:
        additionalProperties: {}
        description: MySQL dynamic configuration parameters
        type: object
      engine:
        additionalProperties: {}
        description: Engine-specific configuration
        type: object
    type: object
  xstores.XStoreDTO:
    description: XStore is a distributed MySQL-compatible storage engine instance.
    properties:
      apiVersion:
        description: API version
        example: polardbx.aliyun.com/v1
        type: string
      kind:
        description: Resource kind
        example: XStore
        type: string
      metadata:
        allOf:
        - $ref: '#/definitions/xstores.ObjectMetaDTO'
        description: Resource metadata
      spec:
        allOf:
        - $ref: '#/definitions/xstores.XStoreSpecDTO'
        description: Desired state specification
      status:
        allOf:
        - $ref: '#/definitions/xstores.XStoreStatusDTO'
        description: Observed state status
    type: object
  xstores.XStoreFollowerDTO:
    description: XStoreFollower represents a read-only follower of an XStore.
    properties:
      apiVersion:
        description: API version
        example: polardbx.aliyun.com/v1
        type: string
      kind:
        description: Resource kind
        example: XStoreFollower
        type: string
      metadata:
        allOf:
        - $ref: '#/definitions/xstores.ObjectMetaDTO'
        description: Resource metadata
      spec:
        allOf:
        - $ref: '#/definitions/xstores.XStoreFollowerSpecDTO'
        description: Desired state specification
      status:
        allOf:
        - $ref: '#/definitions/xstores.XStoreFollowerStatusDTO'
        description: Observed state status
    type: object
  xstores.XStoreFollowerSpecDTO:
    description: Desired state specification for XStore follower.
    properties:
      local:
        description: Local mode (no remote data center)
        example: true
        type: boolean
      resources:
        allOf:
        - $ref: '#/definitions/xstores.ResourceRequirementsDTO'
        description: Resource requirements
      role:
        description: Role of the follower node
        example: Learner
        type: string
      xstore:
        allOf:
        - $ref: '#/definitions/xstores.XStoreReferenceDTO'
        description: Reference to the source XStore
    type: object
  xstores.XStoreFollowerStatusDTO:
    description: Current observed state of XStore follower.
    properties:
      lagSeconds:
        description: Replication lag in seconds
        example: 0
        type: integer
      phase:
        description: Current phase
        example: Running
        type: string
      podName:
        description: Target pod name
        example: my-xstore-follower-0
        type: string
      ready:
        description: Ready status
        example: true
        type: boolean
    type: object
  xstores.XStoreNodeSetDTO:
    description: Configuration for a group of XStore nodes.
    properties:
      name:
        description: Node set name
        example: cand
        type: string
      replicas:
        description: Number of replicas
        example: 3
        type: integer
      role:
        description: Role of nodes in this set (Candidate, Voter, Learner)
        example: Candidate
        type: string
      template:
        allOf:
        - $ref: '#/definitions/xstores.XStorePodTemplateDTO'
        description: Resource requirements
    type: object
  xstores.XStoreParameterTemplateDTO:
    description: Reference to a parameter template.
    properties:
      name:
        description: Template name
        example: default-params
        type: string
      namespace:
        description: Namespace of the template
        example: default
        type: string
    type: object
  xstores.XStorePodDTO:
    description: Pod information for XStore instance.
    properties:
      containerStatuses:
        description: Container statuses
        items:
          $ref: '#/definitions/xstores.ContainerStatusDTO'
        type: array
      creationTimestamp:
        description: Pod creation timestamp
        type: string
      hostIP:
        description: Host IP where pod is running
        example: 192.168.1.100
        type: string
      name:
        description: Pod name
        example: my-xstore-0
        type: string
      namespace:
        description: Pod namespace
        example: default
        type: string
      nodeName:
        description: Node name where pod is scheduled
        example: worker-node-1
        type: string
      phase:
        description: Pod phase (Pending, Running, Succeeded, Failed, Unknown)
        example: Running
        type: string
      podIP:
        description: Pod IP address
        example: 10.244.0.15
        type: string
      role:
        description: Pod role (Leader, Follower, Learner)
        example: Leader
        type: string
    type: object
  xstores.XStorePodTemplateDTO:
    description: Pod template specification for XStore node resources.
    properties:
      hostNetwork:
        description: Host network mode
        type: boolean
      resources:
        allOf:
        - $ref: '#/definitions/xstores.ResourceRequirementsDTO'
        description: Resource requirements
    type: object
  xstores.XStorePrivilegeDTO:
    description: Database account configuration for XStore.
    properties:
      password:
        description: Password (may be referenced from secret)
        type: string
      type:
        description: Privilege type (Super, ReadWrite, ReadOnly, DDLOnly, DMLOnly)
        example: Super
        type: string
      username:
        description: Username for the account
        example: admin
        type: string
    type: object
  xstores.XStoreReferenceDTO:
    description: Reference to the source XStore for backup.
    properties:
      name:
        description: Name of the XStore
        example: my-xstore
        type: string
      uid:
        description: UID of the XStore
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
    type: object
  xstores.XStoreRestoreSpecDTO:
    description: Specification for restoring XStore from backup.
    properties:
      backupSet:
        description: Backup set name to restore from
        example: my-backup
        type: string
      time:
        description: Point-in-time to restore to (RFC3339 format)
        example: "2024-01-15T10:30:00Z"
        type: string
    type: object
  xstores.XStoreSpecDTO:
    description: Desired state specification for an XStore instance.
    properties:
      config:
        allOf:
        - $ref: '#/definitions/xstores.XStoreConfigDTO'
        description: MySQL configuration overlay
      engine:
        description: 'Storage engine type (default: galaxy)'
        example: galaxy
        type: string
      exclusive:
        description: Resource isolation mode
        example: false
        type: boolean
      parameterTemplate:
        allOf:
        - $ref: '#/definitions/xstores.XStoreParameterTemplateDTO'
        description: Parameter template reference
      primaryCluster:
        description: Primary cluster name for read-only replicas
        type: string
      primaryXStore:
        description: Primary XStore name for read-only replicas
        type: string
      privileges:
        description: Database accounts/privileges configuration
        items:
          $ref: '#/definitions/xstores.XStorePrivilegeDTO'
        type: array
      readonly:
        description: Whether the instance is read-only
        example: false
        type: boolean
      restore:
        allOf:
        - $ref: '#/definitions/xstores.XStoreRestoreSpecDTO'
        description: Restore specification for point-in-time recovery
      serviceLabels:
        additionalProperties:
          type: string
        description: Extra labels for the service
        type: object
      serviceName:
        description: Service name override
        example: my-xstore-svc
        type: string
      serviceType:
        description: Kubernetes service type (ClusterIP, NodePort, LoadBalancer)
        example: NodePort
        type: string
      tde:
        allOf:
        - $ref: '#/definitions/xstores.XSTORETDEDTO'
        description: Transparent Data Encryption configuration
      topology:
        allOf:
        - $ref: '#/definitions/xstores.XStoreTopologyDTO'
        description: Topology specification (nodes, replicas, resources)
      upgradeStrategy:
        description: Upgrade strategy (Force, BestEffort)
        example: BestEffort
        type: string
    type: object
  xstores.XStoreStatusDTO:
    description: Current observed state of the XStore instance.
    properties:
      conditions:
        description: Status conditions
        items:
          $ref: '#/definitions/xstores.ConditionDTO'
        type: array
      engineVersion:
        description: Engine version
        example: 8.0.18
        type: string
      leaderPod:
        description: Name of the leader pod
        example: my-xstore-0
        type: string
      observedGeneration:
        description: Last observed generation
        example: 1
        type: integer
      parameterName:
        description: Associated parameter template name
        type: string
      phase:
        description: Current lifecycle phase
        example: Running
        type: string
      readyPods:
        description: Number of ready pods
        example: 3
        type: integer
      readyStatus:
        description: Ready status string (e.g., "3/3")
        example: 3/3
        type: string
      restarting:
        description: Whether pods need restart
        example: false
        type: boolean
      stage:
        description: Current stage within phase
        example: Idle
        type: string
      totalDataDirSize:
        description: Total data directory size
        example: 10Gi
        type: string
      totalPods:
        description: Total number of pods
        example: 3
        type: integer
    type: object
  xstores.XStoreTopologyDTO:
    description: Topology configuration defining node layout and resources.
    properties:
      nodeSets:
        description: Node sets configuration
        items:
          $ref: '#/definitions/xstores.XStoreNodeSetDTO'
        type: array
    type: object
info:
  contact: {}
paths:
