            additionalProperties: true
            type: object
        "401":
          description: Authentication required or invalid authentication state
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Diagnostic job or file not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Diagnostic report not ready yet
