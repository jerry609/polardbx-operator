apiVersion: apps/v1
kind: Deployment
metadata:
  name: polardbx-ui-backend
  labels:
    app: polardbx-ui-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polardbx-ui-backend
  template:
    metadata:
      labels:
        app: polardbx-ui-backend
    spec:
      containers:
      - name: backend
        image: polardbx-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: polardbx-ui-backend-config
        - secretRef:
            name: polardbx-ui-backend-secret
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/kube
          readOnly: true
        # Note: If kubeconfig references external certificate files,
        # consider using ServiceAccount with in-cluster config instead
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: kubeconfig
        secret:
          secretName: polardbx-ui-backend-secret
          items:
          - key: kubeconfig
            path: kubeconfig

