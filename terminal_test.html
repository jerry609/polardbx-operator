<!DOCTYPE html>
<html>
<head>
    <title>极简终端测试</title>
    <style>
        body { 
            margin: 20px; 
            font-family: Monaco, monospace;
            background: #1e1e1e;
            color: #ffffff;
        }
        #terminal {
            width: 800px;
            height: 400px;
            background: #000000;
            color: #ffffff;
            padding: 10px;
            border: 1px solid #333;
            font-family: Monaco, Consolas, monospace;
            font-size: 14px;
            overflow: auto;
            white-space: pre-wrap;
            outline: none;
        }
        #status {
            margin: 10px 0;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #005a9e; }
        .green { color: #00ff00; }
        .red { color: #ff0000; }
        .yellow { color: #ffff00; }
    </style>
</head>
<body>
    <h1>🚀 极简 WebSocket 终端测试</h1>
    
    <div id="status">
        状态: <span id="wsStatus" class="red">未连接</span> | 
        容器: <span id="container">-</span> | 
        键盘: <span id="keyboard" class="red">未就绪</span>
    </div>
    
    <div>
        <button onclick="setKubeconfig()">设置 Kubeconfig</button>
        <button onclick="testGetPod()">测试: 获取Pod信息</button>
        <button onclick="connect()">连接终端</button>
        <button onclick="sendCommand('whoami')">测试: whoami</button>
        <button onclick="sendCommand('pwd')">测试: pwd</button>
        <button onclick="sendCommand('ls')">测试: ls</button>
        <button onclick="clearTerminal()">清屏</button>
    </div>
    
    <div id="terminal" tabindex="0">点击这里开始，然后按任意键测试...</div>
    
    <script>
        let ws = null;
        let terminal = document.getElementById('terminal');
        let wsStatus = document.getElementById('wsStatus');
        let container = document.getElementById('container');
        let keyboard = document.getElementById('keyboard');
        
        // 模拟的测试参数 - 请根据实际情况修改
        const testConfig = {
            namespace: 'default',
            pod: 'quick-start-minimal-j7sv-cdc-default-76f847c7db-l74tj',
            container: 'engine'
        };
        
        // 从 localStorage 获取 kubeconfig
        const kubeconfig = localStorage.getItem('kubeconfig') || '';
        
        function updateStatus(status, color) {
            wsStatus.textContent = status;
            wsStatus.className = color;
        }
        
        function log(message, color = 'white') {
            const timestamp = new Date().toLocaleTimeString();
            terminal.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function connect() {
            if (!kubeconfig) {
                log('❌ 未找到 kubeconfig，请先在主界面登录', 'red');
                return;
            }
            
            if (ws) {
                ws.close();
            }
            
            const kubeconfigB64 = btoa(unescape(encodeURIComponent(kubeconfig)));
            const url = `ws://localhost:8080/api/v1/pods/${testConfig.namespace}/${testConfig.pod}/exec?container=${testConfig.container}&k=${encodeURIComponent(kubeconfigB64)}`;
            
            log('🔗 连接到: ' + url, 'yellow');
            container.textContent = testConfig.container;
            
            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = () => {
                log('✅ WebSocket 连接成功', 'green');
                updateStatus('已连接', 'green');
                keyboard.textContent = '就绪';
                keyboard.className = 'green';
                terminal.focus();
            };
            
            ws.onmessage = (ev) => {
                let text = '';
                if (typeof ev.data === 'string') {
                    text = ev.data;
                } else if (ev.data instanceof ArrayBuffer) {
                    text = new TextDecoder().decode(new Uint8Array(ev.data));
                }
                
                // 直接追加到终端，不加时间戳
                terminal.textContent += text;
                terminal.scrollTop = terminal.scrollHeight;
            };
            
            ws.onerror = (error) => {
                log('❌ WebSocket 错误: ' + error, 'red');
                updateStatus('错误', 'red');
            };
            
            ws.onclose = (event) => {
                log(`🔚 连接关闭: ${event.code} ${event.reason}`, 'yellow');
                updateStatus('已断开', 'yellow');
                keyboard.textContent = '未就绪';
                keyboard.className = 'red';
            };
        }
        
        function sendCommand(cmd) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('⚠️ WebSocket 未连接', 'yellow');
                return;
            }
            
            log(`📤 发送命令: ${cmd}`, 'yellow');
            ws.send(cmd + '\r');
        }
        
        function clearTerminal() {
            terminal.textContent = '';
        }
        
        function testGetPod() {
            if (!kubeconfig) {
                log('❌ 未找到 kubeconfig，请先设置', 'red');
                return;
            }
            
            const kubeconfigB64 = btoa(unescape(encodeURIComponent(kubeconfig)));
            const url = `http://localhost:8080/api/v1/pods/${testConfig.namespace}/${testConfig.pod}`;
            
            log('🔍 测试 getPod API: ' + url, 'yellow');
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Kubeconfig-B64': kubeconfigB64
                }
            })
            .then(response => {
                log(`📋 HTTP 状态: ${response.status} ${response.statusText}`, response.ok ? 'green' : 'red');
                return response.json();
            })
            .then(data => {
                if (data.error) {
                    log('❌ API 错误: ' + data.error, 'red');
                } else {
                    log('✅ 获取 Pod 成功: ' + data.metadata?.name, 'green');
                    log('📦 容器列表: ' + (data.spec?.containers || []).map(c => c.name).join(', '), 'white');
                }
            })
            .catch(error => {
                log('❌ 请求失败: ' + error.message, 'red');
            });
        }
        
        function setKubeconfig() {
            const input = prompt('请粘贴 kubeconfig 内容:');
            if (input && input.trim()) {
                localStorage.setItem('kubeconfig', input.trim());
                window.location.reload();
            }
        }
        
        function testGetPod() {
            if (!kubeconfig) {
                log('❌ 未找到 kubeconfig，请先在主界面登录', 'red');
                return;
            }
            
            const kubeconfigB64 = btoa(unescape(encodeURIComponent(kubeconfig)));
            const url = `http://localhost:8080/api/v1/pods/${testConfig.namespace}/${testConfig.pod}`;
            
            log('🔍 测试获取Pod信息: ' + url, 'yellow');
            
            fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                    'X-Kubeconfig-B64': kubeconfigB64
                }
            })
            .then(response => {
                log(`📡 HTTP ${response.status} ${response.statusText}`, response.ok ? 'green' : 'red');
                return response.text();
            })
            .then(text => {
                if (text.length > 500) {
                    log('✅ 获取Pod信息成功，数据长度: ' + text.length + ' 字符', 'green');
                    log('📋 Pod名称: ' + JSON.parse(text).metadata?.name, 'white');
                    log('📋 Pod状态: ' + JSON.parse(text).status?.phase, 'white');
                    const containers = JSON.parse(text).spec?.containers?.map(c => c.name) || [];
                    log('📋 容器列表: ' + containers.join(', '), 'white');
                } else {
                    log('❌ 响应数据异常: ' + text, 'red');
                }
            })
            .catch(error => {
                log('❌ 请求失败: ' + error.message, 'red');
            });
        }
        
        // 键盘事件处理
        terminal.addEventListener('keydown', (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('⚠️ WebSocket 未连接，按键被忽略', 'yellow');
                e.preventDefault();
                return;
            }
            
            let data = '';
            if (e.key === 'Enter') {
                data = '\r';
            } else if (e.key === 'Backspace') {
                data = '\x7f';
            } else if (e.key.length === 1) {
                data = e.key;
            } else if (e.key === 'ArrowUp') {
                data = '\x1b[A';
            } else if (e.key === 'ArrowDown') {
                data = '\x1b[B';
            } else if (e.key === 'ArrowRight') {
                data = '\x1b[C';
            } else if (e.key === 'ArrowLeft') {
                data = '\x1b[D';
            }
            
            if (data) {
                e.preventDefault();
                console.log('📤 发送按键:', JSON.stringify(data));
                ws.send(data);
            }
        });
        
        terminal.addEventListener('click', () => {
            terminal.focus();
        });
        
        // 页面加载完成后的提示
        window.onload = () => {
            log('🎯 测试页面已加载', 'green');
            log('📋 容器信息: ' + testConfig.namespace + '/' + testConfig.pod + '/' + testConfig.container, 'white');
            if (kubeconfig) {
                log('✅ 找到 kubeconfig，可以连接', 'green');
            } else {
                log('❌ 未找到 kubeconfig，请先在主界面登录', 'red');
            }
        };
    </script>
</body>
</html>
